spring.application.name=qiyegongdansys

# ===== Server =====
server.port=8080
server.servlet.context-path=/api

# ===== Database (MySQL) =====
spring.datasource.url=jdbc:mysql://localhost:3306/qiyegongdansys?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=123456
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# ===== Upload =====
app.upload.dir=./uploads
app.upload.max-size-mb=20

# ===== JWT =====
# For production, inject via environment variable JWT_SECRET
app.jwt.secret=QiyegongdansysSecretKeyForJwtHmacSha512MustBeAtLeast64BytesLong!!2026
app.jwt.expiration-ms=86400000

